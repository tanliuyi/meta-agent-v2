appId: com.meta-agent.desktop
productName: Meta Agent
asar: true
directories:
  buildResources: build
  output: output/installers
files:
  - out/**/*
  - package.json
asarUnpack:
  - out/sidecar/**/*
  - node_modules/**/*
extraResources:
  - from: output/pi-sidecar/runtime-manifest.json
    to: pi-sidecar/runtime-manifest.json
  # Windows 系统托盘图标（16x16/32x32 多尺寸 ICO）。
  - from: build/icon.ico
    to: tray-icon.ico
afterPack: ../../scripts/validate-desktop-package.mjs
afterSign: ../../scripts/validate-desktop-signing.mjs
mac:
  icon: build/icon.png
  artifactName: meta-agent-desktop-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: meta-agent-desktop-${version}-setup.${ext}
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
buildDependenciesFromSource: false
publish:
  provider: github
  owner: tanliuyi
  repo: meta-agent-harness
  releaseType: release
